{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 animated-fade-in" id="register-page-container">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        
        <!-- Premium Registration Card -->
        <div class="card custom-card border-0 shadow-lg my-5" id="register-card">
            <div class="card-body p-4 p-md-5">
                
                <!-- Logo & Heading -->
                <div class="text-center mb-4" id="register-header-section">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light-blue text-primary rounded-circle mb-3 shadow-sm" 
                         style="width: 70px; height: 70px;" id="register-logo-icon">
                        <i class="bi bi-person-plus-fill fs-2 text-primary"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-1 text-primary" id="register-title">Create Account</h1>
                    <p class="text-muted small" id="register-subtitle">Sign up to get started on the quiz pipeline</p>
                </div>
                
                <!-- Registration Form -->
                <form action="{{ url_for('auth.register') }}" method="POST" class="needs-validation" novalidate id="register-form">
                    
                    <!-- CSRF Protection Token -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <!-- Full Name Input -->
                    <div class="mb-3" id="fullname-group">
                        <label for="fullname" class="form-label fw-semibold text-dark small" id="fullname-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" id="fullname-icon-addon">
                                <i class="bi bi-person text-muted"></i>
                            </span>
                            <input type="text" class="form-control bg-light border-start-0 py-2 small" 
                                   id="fullname" name="fullname" value="{{ fullname or '' }}" 
                                   placeholder="John Doe" required autocomplete="name" id="fullname-input">
                        </div>
                    </div>
                    
                    <!-- Email Address Input -->
                    <div class="mb-3" id="email-group">
                        <label for="email" class="form-label fw-semibold text-dark small" id="email-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" id="email-icon-addon">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="email" class="form-control bg-light border-start-0 py-2 small" 
                                   id="email" name="email" value="{{ email or '' }}" 
                                   placeholder="john@example.com" required autocomplete="email" id="email-input">
                        </div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="mb-3" id="password-group">
                        <label for="password" class="form-label fw-semibold text-dark small" id="password-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" id="password-icon-addon">
                                <i class="bi bi-key text-muted"></i>
                            </span>
                            <input type="password" class="form-control bg-light border-start-0 py-2 small" 
                                   id="password" name="password" placeholder="Min. 6 characters" required autocomplete="new-password" id="password-input">
                        </div>
                    </div>
                    
                    <!-- Confirm Password Input -->
                    <div class="mb-4" id="confirm-password-group">
                        <label for="confirm_password" class="form-label fw-semibold text-dark small" id="confirm-password-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" id="confirm-password-icon-addon">
                                <i class="bi bi-shield-check text-muted"></i>
                            </span>
                            <input type="password" class="form-control bg-light border-start-0 py-2 small" 
                                   id="confirm_password" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password" id="confirm-password-input">
                        </div>
                    </div>
                    
                    <!-- Submit Registration Button -->
                    <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill transition-btn shadow-sm" type="submit" id="register-submit-btn">
                        <i class="bi bi-person-check me-1"></i> Register Account
                    </button>
                    
                </form>
                
                <!-- Login Redirect Footer -->
                <div class="text-center mt-4 pt-3 border-top" id="register-footer-section">
                    <p class="mb-0 text-muted small" id="login-redirect-text">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none" id="login-redirect-link">
                            Sign In
                        </a>
                    </p>
                </div>
                
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
