{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-12 col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
                    <h2 class="fw-bold mt-2 h4">Create Account</h2>
                    <p class="text-muted small">Join BrainCheck and start quizzing</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="fullname" class="form-label small fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="fullname" name="fullname"
                               value="{{ fullname or '' }}" placeholder="Your name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email or '' }}" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="At least 6 characters" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label small fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="Repeat password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle me-1"></i> Create Account
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="mb-0 small text-muted">
                        Already registered?
                        <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign in</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
