{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-12 col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h2 class="fw-bold mt-2 h4">Sign In</h2>
                    <p class="text-muted small">Welcome back to BrainCheck</p>
                </div>

                <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email or '' }}" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Your password" required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
                        <label class="form-check-label small text-muted" for="remember">Keep me logged in</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="mb-0 small text-muted">
                        No account yet?
                        <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
