{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 animated-fade-in" id="login-page-container">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        
        <!-- Premium Login Card -->
        <div class="card custom-card border-0 shadow-lg my-5" id="login-card">
            <div class="card-body p-4 p-md-5">
                
                <!-- Logo & Heading -->
                <div class="text-center mb-4" id="login-header-section">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light-blue text-primary rounded-circle mb-3 shadow-sm" 
                         style="width: 70px; height: 70px;" id="login-logo-icon">
                        <i class="bi bi-shield-lock-fill fs-2 text-primary"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-1 text-primary" id="login-title">Welcome Back</h1>
                    <p class="text-muted small" id="login-subtitle">Sign in to resume your quiz pipeline challenges</p>
                </div>
                
                <!-- Login Form -->
                <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST" class="needs-validation" novalidate id="login-form">
                    
                    <!-- CSRF Protection Token -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <!-- Email Address Input -->
                    <div class="mb-3" id="email-group">
                        <label for="email" class="form-label fw-semibold text-dark small" id="email-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" id="email-icon-addon">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="email" class="form-control bg-light border-start-0 py-2 small" 
                                   id="email" name="email" value="{{ email or '' }}" 
                                   placeholder="name@example.com" required autocomplete="email" id="email-input">
                        </div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="mb-4" id="password-group">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold text-dark small mb-0" id="password-label">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" id="password-icon-addon">
                                <i class="bi bi-key text-muted"></i>
                            </span>
                            <input type="password" class="form-control bg-light border-start-0 py-2 small" 
                                   id="password" name="password" placeholder="••••••••" required autocomplete="current-password" id="password-input">
                        </div>
                    </div>
                    
                    <!-- Remember Me Option -->
                    <div class="d-flex align-items-center justify-content-between mb-4" id="remember-me-section">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
                            <label class="form-check-label text-muted small user-select-none" for="remember" id="remember-label">
                                Keep me logged in
                            </label>
                        </div>
                    </div>
                    
                    <!-- Sign In Submit Button -->
                    <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill transition-btn shadow-sm" type="submit" id="login-submit-btn">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                    
                </form>
                
                <!-- Registration Redirect Footer -->
                <div class="text-center mt-4 pt-3 border-top" id="login-footer-section">
                    <p class="mb-0 text-muted small" id="register-redirect-text">
                        Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none" id="register-redirect-link">
                            Create Account
                        </a>
                    </p>
                </div>
                
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
